// ── MENU ──
function toggleMenu(id, parentEl) {
  const sub = document.getElementById('sub-' + id);
  const arrow = document.getElementById('arrow-' + id);
  if (!sub) return;
  const isOpen = sub.classList.contains('open');
  document.querySelectorAll('.nav-sub').forEach(s => s.classList.remove('open'));
  document.querySelectorAll('.nav-arrow').forEach(a => a.classList.remove('open'));
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  if (!isOpen) { sub.classList.add('open'); if (arrow) arrow.classList.add('open'); parentEl.classList.add('active'); }
}
function setNavActive(el) {
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  document.querySelectorAll('.nav-sub').forEach(s => s.classList.remove('open'));
  document.querySelectorAll('.nav-arrow').forEach(a => a.classList.remove('open'));
  el.classList.add('active');
}
function setSubActive(el) {
  document.querySelectorAll('.nav-sub-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
}
function toggleSidebar() {
  document.querySelector('.sidebar').classList.toggle('open');
  document.querySelector('.sidebar-overlay').classList.toggle('show');
}
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    btn.closest('.tab-group').querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});
 
// ── SIDEBAR
fetch('sidebar.html')
  .then(res => res.text())
  .then(html => {
    document.getElementById('sidebar-container').innerHTML = html;
 
    // Marcar automáticamente el item activo según la página actual
    const pagina = window.location.pathname.split('/').pop();
    document.querySelectorAll('.nav-sub-item a').forEach(a => {
      if (a.getAttribute('href') === pagina) {
        a.closest('.nav-sub-item').classList.add('active');
 
        // Abrir el submenu padre automáticamente
        const sub = a.closest('.nav-sub');
        if (sub) {
          sub.classList.add('open');
          const id = sub.id.replace('sub-', '');
          const arrow = document.getElementById('arrow-' + id);
          if (arrow) arrow.classList.add('open');
          const parentItem = sub.previousElementSibling;
          if (parentItem) parentItem.classList.add('active');
        }
      }
    });
    document.body.style.visibility = 'visible';
  })
  .catch(err => {
    console.error('No se pudo cargar sidebar.html:', err);
    document.body.style.visibility = 'visible'; // mostrar igual aunque falle
  });

const trophyFallbackSVG = `
<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M14 6H34V16C34 22.6274 29.5228 28 24 28C18.4772 28 14 22.6274 14 16V6Z" fill="currentColor"/>
  <path d="M14 8H8V12C8 16 11 19 14 19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M34 8H40V12C40 16 37 19 34 19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="21" y="28" width="6" height="8" fill="currentColor"/>
  <path d="M15 40H33L31 36H17L15 40Z" fill="currentColor"/>
  <rect x="12" y="40" width="24" height="3.5" rx="1" fill="currentColor"/>
</svg>`;
 
const recordIconSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8M12 17v4M17 4H7v6a5 5 0 0 0 10 0V4z"/><path d="M7 5H4v2a4 4 0 0 0 3.4 4M17 5h3v2a4 4 0 0 1-3.4 4"/></svg>`;
 
function trophyCell(item){
  if(item.trophyImg){
    return `<div class="trophy-mini">
      <div class="glow"></div>
      <img src="${item.trophyImg}" alt="Trofeo ${item.year}"
           onerror="this.outerHTML='${trophyFallbackSVG.replace(/'/g,"\\'")}'; this.parentElement.style.color='var(--gold-bright)';">
    </div>`;
  }
  return `<div class="trophy-mini" style="color:var(--gold-bright)">
    <div class="glow"></div>
    ${trophyFallbackSVG}
  </div>`;
}
 
function finalRow(item){
  if(!item.final) return `<div class="final-row"></div>`;

  const club = item.final.clubImg
    ? `<img class="rival-crest" src="${item.final.clubImg}" alt="">`
    : "";

  const rival = item.final.rivalImg
    ? `<img class="rival-crest" src="${item.final.rivalImg}" alt=""
         onerror="this.outerHTML='<div class=&quot;rival-crest fallback&quot;>${(item.final.rivalAbbr||'??').slice(0,2).toUpperCase()}</div>'">`
    : (item.final.rivalAbbr ? `<div class="rival-crest fallback">${item.final.rivalAbbr.slice(0,2).toUpperCase()}</div>` : "");

  return `<div class="final-row">${club}<span class="score">${item.final.score}</span>${rival}</div>`;
}

function cardHTML(item){
  return `
    <div class="card1">
      <div class="card1-top">
        <div class="year">${item.year}</div>
        ${trophyCell(item)}
      </div>
      <div class="name">${item.name}</div>
      ${finalRow(item)}
    </div>
  `;
}
 
const content = document.getElementById('content');
 
function render(cat){
  content.innerHTML = "";
  const sections = DATA[cat] || [];
  if(!sections.length){
    content.innerHTML = `<div class="section show" style="text-align:center; color:var(--dim); font-family:'JetBrains Mono',monospace; font-size:13px; padding:60px 20px;">
      Todavía no hay títulos cargados en esta categoría.
    </div>`;
    return;
  }
 
  sections.forEach(sec => {
    const section = document.createElement('section');
    section.className = 'section';
 
    let body = '';
    if(sec.groups){
      // Varios subtítulos dentro de la misma sección
      body = sec.groups.map(g => `
        <div class="group-label">${g.label}</div>
        <div class="grid">${g.titles.map(cardHTML).join('')}</div>
      `).join('');
    } else {
      // Formato clásico: una sola grilla
      body = `<div class="grid">${sec.titles.map(cardHTML).join('')}</div>`;
    }
 
    section.innerHTML = `
      <div class="section-head">
        <div class="tally">
          <div class="tally-num">${sec.count}</div>
          <div class="tally-text">
            <div class="eyebrow">${sec.eyebrow}</div>
            <div class="title">${sec.title}</div>
          </div>
        </div>
        ${sec.record ? `<div class="record-badge">${recordIconSVG}${sec.record}</div>` : ""}
      </div>
      ${body}
    `;
    content.appendChild(section);
  });
 
  requestAnimationFrame(() => {
    document.querySelectorAll('.section').forEach((el,i) => {
      setTimeout(() => el.classList.add('show'), i * 90);
    });
  });
}
 
document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab');
  if(!btn) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  render(btn.dataset.cat);
});
 
render('masculino');
