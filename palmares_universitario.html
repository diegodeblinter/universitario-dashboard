<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palmarés — Universitario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a121e;
    --panel:#111d30;
    --panel-2:#16233a;
    --card:#0e1a2c;
    --line:#22344c;
    --blue:#3d7fef;
    --blue-bright:#6ea3ff;
    --gold:#d4af37;
    --gold-bright:#f2d271;
    --red:#c0392b;
    --cream:#eef2f7;
    --dim:#7c8aa0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(ellipse 1000px 500px at 15% -10%, rgba(61,127,239,0.14), transparent 55%),
      radial-gradient(ellipse 800px 500px at 100% 0%, rgba(212,175,55,0.07), transparent 55%),
      var(--bg);
    color:var(--cream);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    padding:28px 20px 70px;
  }
  .wrap{ max-width:1280px; margin:0 auto; }




  /* ---------- TABS ---------- */
  .tabs{
    display:flex; gap:10px; flex-wrap:wrap;
    margin-bottom:26px;
  }
  .tab{
    display:flex; align-items:center; gap:8px;
    font-family:'Work Sans', sans-serif;
    font-weight:600; font-size:13.5px;
    color:var(--dim);
    background:var(--panel);
    border:1px solid var(--line);
    padding:11px 20px;
    border-radius:100px;
    cursor:pointer;
    transition:all 0.25s ease;
  }
  .tab svg{ width:15px; height:15px; opacity:0.75; transition:opacity .25s; }
  .tab:hover{ color:var(--cream); border-color:var(--blue); }
  .tab.active{
    color:#fff;
    background:linear-gradient(135deg, var(--blue), #2a5fd0);
    border-color:transparent;
    box-shadow:0 8px 22px -8px rgba(61,127,239,0.6);
  }
  .tab.active svg{ opacity:1; }

  /* ---------- SECTION ---------- */
  .section{
    position:relative;
    background:linear-gradient(160deg, var(--panel), var(--panel-2));
    border:1px solid var(--line);
    border-radius:20px;
    padding:30px 30px 34px;
    margin-bottom:34px;
    opacity:0;
    transform:translateY(18px);
    transition:opacity .6s ease, transform .6s ease;
    overflow:hidden;
  }
  .section.show{ opacity:1; transform:translateY(0); }
  .section::before{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(115deg, transparent 42%, rgba(255,255,255,0.04) 50%, transparent 58%);
    pointer-events:none;
  }

  .section-head{
    display:flex; align-items:flex-end; justify-content:space-between;
    flex-wrap:wrap; gap:16px;
    margin-bottom:24px;
    position:relative; z-index:1;
  }
  .tally{ display:flex; align-items:center; gap:16px; }
  .tally-num{
    font-family:'Bebas Neue', sans-serif;
    font-size:64px;
    line-height:0.9;
    background:linear-gradient(180deg, var(--blue-bright), var(--blue));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .tally-text .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--dim);
  }
  .tally-text .title{
    font-family:'Bebas Neue', sans-serif;
    font-size:24px; letter-spacing:0.01em;
    color:var(--cream);
    margin-top:2px;
  }

  .record-badge{
    display:flex; align-items:center; gap:7px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
    color:#3a2c06;
    background:linear-gradient(135deg, var(--gold-bright), var(--gold));
    padding:8px 14px 8px 10px;
    border-radius:8px;
    box-shadow:0 6px 16px -6px rgba(212,175,55,0.55);
    font-weight:700;
  }
  .record-badge svg{ width:14px; height:14px; }




  /* ---------- GRID / CARDS ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(168px, 1fr));
    gap:16px;
    position:relative; z-index:1;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:13px;
    padding:16px 15px 14px;
    position:relative;
    transition:transform .3s ease, border-color .3s ease, box-shadow .3s ease, background .3s ease;
  }
  .card:hover{
    transform:translateY(-4px);
    border-color:var(--gold);
    background:#101d31;
    box-shadow:0 16px 30px -16px rgba(212,175,55,0.4);
  }

  .card-top{
    display:flex; align-items:flex-start; justify-content:space-between;
    margin-bottom:10px;
  }
  .year{
    font-family:'Bebas Neue', sans-serif;
    font-size:26px;
    color:var(--cream);
    letter-spacing:0.01em;
    line-height:1;
  }
  .trophy-mini{
    position:relative;
    width:34px; height:34px;
    flex:none;
    display:flex; align-items:center; justify-content:center;
  }
  .trophy-mini .glow{
    position:absolute; inset:-10px;
    border-radius:50%;
    background:radial-gradient(circle, var(--gold) 0%, transparent 70%);
    opacity:0.28;
    transition:opacity .3s ease, transform .3s ease;
    filter:blur(1.5px);
  }
  .card:hover .trophy-mini .glow{ opacity:0.6; transform:scale(1.3); }
  .trophy-mini img, .trophy-mini svg{
    width:26px; height:26px;
    position:relative; z-index:1;
    object-fit:contain;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,0.55));
    transition:transform .3s ease;
  }
  .card:hover .trophy-mini img,
  .card:hover .trophy-mini svg{ transform:scale(1.1) rotate(-3deg); }

  .name{
    font-size:11.5px;
    font-weight:600;
    letter-spacing:0.01em;
    color:var(--dim);
    text-transform:uppercase;
    line-height:1.25;
    min-height:28px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .card{ display:flex; flex-direction:column; }
  .final-row{
    margin-top:12px;
    padding-top:10px;
    border-top:1px dashed var(--line);
    display:flex; align-items:center; gap:8px;
    min-height:20px;
  }
  .rival-crest{
    width:18px; height:18px; border-radius:4px;
    object-fit:contain;
    flex:none;
    background:#0a1420;
  }
  .rival-crest.fallback{
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace;
    font-size:8px; font-weight:700;
    color:var(--dim);
    border:1px solid var(--line);
  }
  .score{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; font-weight:600;
    color:var(--gold-bright);
    letter-spacing:0.02em;
  }

  footer{
    text-align:center; padding:30px 0 10px; color:var(--dim);
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.06em;
  }

  @media (max-width:600px){
    .grid{ grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:12px; }
    .tally-num{ font-size:48px; }
    .section{ padding:22px 18px 26px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <nav class="tabs" id="tabs">
    <button class="tab active" data-cat="masculino">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4h10v4a5 5 0 0 1-10 0V4z"/><path d="M7 5H4v2a4 4 0 0 0 3.4 4" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M17 5h3v2a4 4 0 0 1-3.4 4" stroke="currentColor" stroke-width="1.4" fill="none"/><rect x="10" y="14" width="4" height="4"/><path d="M8 21h8l-1-3H9l-1 3z"/></svg>
      Masculino
    </button>
    <button class="tab" data-cat="femenino">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4h10v4a5 5 0 0 1-10 0V4z"/></svg>
      Femenino
    </button>
    <button class="tab" data-cat="reserva">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4h10v4a5 5 0 0 1-10 0V4z"/></svg>
      Reserva
    </button>
    <button class="tab" data-cat="futsal">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4h10v4a5 5 0 0 1-10 0V4z"/></svg>
      Futsal
    </button>
    <button class="tab" data-cat="voley">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4h10v4a5 5 0 0 1-10 0V4z"/></svg>
      Vóley
    </button>
  </nav>

  <main id="content"></main>

  <footer>Reemplazá las rutas de imagen en DATA por tus fotos reales de trofeos y escudos · si una imagen falla, se usa un ícono de respaldo automático</footer>
</div>





<script>
  
/* ============================================================
   DATA — un objeto por categoría (masculino, femenino, ...).
   Cada categoría tiene una o más secciones (torneos nacionales,
   internacionales, etc). Cada título admite:
     year, name, trophyImg (opcional), final: { score, rivalImg, rivalAbbr } (opcional)
   Si trophyImg / rivalImg no existen o fallan al cargar,
   se reemplazan automáticamente por un ícono de respaldo.
   ============================================================ */
const DATA = {
  masculino: [
    {
      count: 29,
      eyebrow: "Torneos nacionales",
      title: "Primera División del Perú",
      record: "Récord nacional",
      titles: [
        { year:1929, name:"Liga Provincial de Football" },
        { year:1934, name:"Liga Provincial de Football", final:{ score:"2 - 1" } },
        { year:1939, name:"Campeonato Peruano" },
        { year:1941, name:"Campeonato Peruano" },
        { year:1945, name:"Campeonato Peruano" },
        { year:1946, name:"Campeonato Peruano" },
        { year:1949, name:"Campeonato Peruano" },
        { year:1959, name:"Campeonato Peruano" },
        { year:1960, name:"Campeonato Peruano" },
        { year:1964, name:"Campeonato Peruano" },
        { year:1966, name:"Campeonato Descentralizado" },
        { year:1967, name:"Campeonato Descentralizado" },
        { year:1969, name:"Campeonato Descentralizado" },
        { year:1971, name:"Campeonato Descentralizado" },
        { year:1974, name:"Campeonato Descentralizado" },
        { year:1982, name:"Campeonato Descentralizado" },
        { year:1985, name:"Campeonato Descentralizado" },
        { year:1987, name:"Campeonato Descentralizado", final:{ score:"1 - 0" } },
        { year:1990, name:"Campeonato Descentralizado", final:{ score:"4 - 2" } },
        { year:1992, name:"Campeonato Descentralizado" },
        { year:1993, name:"Campeonato Descentralizado" },
        { year:1998, name:"Campeonato Descentralizado", final:{ score:"3:4 - 3:2" } },
        { year:1999, name:"Campeonato Descentralizado", final:{ score:"3 - 1" } },
        { year:2000, name:"Campeonato Descentralizado" },
        { year:2009, name:"Campeonato Descentralizado", final:{ score:"2 - 0" } },
        { year:2013, name:"Campeonato Descentralizado", final:{ score:"1:5 - 1:4" } },
        { year:2023, name:"Fútbol Profesional Liga 1", final:{ score:"3 - 1" } },
        { year:2024, name:"Fútbol Profesional Liga 1" },
        { year:2025, name:"Fútbol Profesional Liga 1" },
      ]
    }
  ],
  femenino: [],
  reserva: [],
  futsal: [],
  voley: []
};

const trophyFallbackSVG = `
<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M14 6H34V16C34 22.6274 29.5228 28 24 28C18.4772 28 14 22.6274 14 16V6Z" fill="currentColor"/>
  <path d="M14 8H8V12C8 16 11 19 14 19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M34 8H40V12C40 16 37 19 34 19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="21" y="28" width="6" height="8" fill="currentColor"/>
  <path d="M15 40H33L31 36H17L15 40Z" fill="currentColor"/>
  <rect x="12" y="40" width="24" height="3.5" rx="1" fill="currentColor"/>
</svg>`;

const recordIconSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8M12 17v4M17 4H7v6a5 5 0 0 0 10 0V4z"/><path d="M7 5H4v2a4 4 0 0 0 3.4 4M17 5h3v2a4 4 0 0 1-3.4 4"/></svg>`;

function trophyCell(item){
  if(item.trophyImg){
    return `<div class="trophy-mini">
      <div class="glow"></div>
      <img src="${item.trophyImg}" alt="Trofeo ${item.year}"
           onerror="this.outerHTML='${trophyFallbackSVG.replace(/'/g,"\\'")}'; this.parentElement.style.color='var(--gold-bright)';">
    </div>`;
  }
  return `<div class="trophy-mini" style="color:var(--gold-bright)">
    <div class="glow"></div>
    ${trophyFallbackSVG}
  </div>`;
}

function finalRow(item){
  if(!item.final) return `<div class="final-row"></div>`;
  const rival = item.final.rivalImg
    ? `<img class="rival-crest" src="${item.final.rivalImg}" alt=""
         onerror="this.outerHTML='<div class=&quot;rival-crest fallback&quot;>${(item.final.rivalAbbr||'??').slice(0,2).toUpperCase()}</div>'">`
    : (item.final.rivalAbbr ? `<div class="rival-crest fallback">${item.final.rivalAbbr.slice(0,2).toUpperCase()}</div>` : "");
  return `<div class="final-row">${rival}<span class="score">${item.final.score}</span></div>`;
}

const content = document.getElementById('content');

function render(cat){
  content.innerHTML = "";
  const sections = DATA[cat] || [];
  if(!sections.length){
    content.innerHTML = `<div class="section show" style="text-align:center; color:var(--dim); font-family:'JetBrains Mono',monospace; font-size:13px; padding:60px 20px;">
      Todavía no hay títulos cargados en esta categoría.
    </div>`;
    return;
  }
  sections.forEach(sec => {
    const section = document.createElement('section');
    section.className = 'section';
    const cards = sec.titles.map(item => `
      <div class="card">
        <div class="card-top">
          <div class="year">${item.year}</div>
          ${trophyCell(item)}
        </div>
        <div class="name">${item.name}</div>
        ${finalRow(item)}
      </div>
    `).join('');
    section.innerHTML = `
      <div class="section-head">
        <div class="tally">
          <div class="tally-num">${sec.count}</div>
          <div class="tally-text">
            <div class="eyebrow">${sec.eyebrow}</div>
            <div class="title">${sec.title}</div>
          </div>
        </div>
        ${sec.record ? `<div class="record-badge">${recordIconSVG}${sec.record}</div>` : ""}
      </div>
      <div class="grid">${cards}</div>
    `;
    content.appendChild(section);
  });
  requestAnimationFrame(() => {
    document.querySelectorAll('.section').forEach((el,i) => {
      setTimeout(() => el.classList.add('show'), i * 90);
    });
  });
}

document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab');
  if(!btn) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  render(btn.dataset.cat);
});

render('masculino');
</script>
</body>
</html>
