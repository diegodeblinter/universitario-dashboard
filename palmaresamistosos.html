body { visibility: hidden; }

.app {
  display: flex;
  height: 100vh;

}

.sidebar {
  position: sticky; /* o fixed */

.pm-club, .pm-opp {

.pm-club img, .pm-opp img {

  :root {
    --fondo: #191d29;
    --panel: #191d29;
    --panel-izq: #191d29;
    --borde: #131318;
    --azul: #eeb20c;
    --azul-claro: #5293cf;
    --texto: #f2f2f4;
    --texto-tenue: #8a8a92;
  }

  * { margin:0; padding:0; box-sizing:border-box; }



  .header {
    text-align: center;
    margin-bottom: 36px;
  }

  .header .eyebrow {
    font-size: 0.7rem;
    letter-spacing: 4px;
    color: #06327e;
    text-transform: uppercase;
    font-weight: 600;
  }

  .header h1 {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 800;
    margin: 6px 0 8px;
  }

  .header p {
    color: var(--texto-tenue);
    font-size: 0.85rem;
  }

.grid {
  width: 100%;
  max-width: 1900px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 18px;
  height: auto;
  min-height: 190px;
}

  /* ---------- TARJETA ---------- */
  .palmares-page .card {
    display: flex;
    background: #191d29;
    border-radius: 16px;
    overflow: hidden;
    height: 200px; /* altura FIJA: ninguna imagen puede agrandar la tarjeta */
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }

  .palmares-page .card-imagen {
    flex: 0 0 30%;
    position: relative;
    background:
      radial-gradient(circle at 30% 30%, #191d29, transparent 60%),
      #191d29;
    display: flex;
    align-items: flex-end;   /* todos los trofeos "paran" sobre la misma base */
    justify-content: center;
    padding: 16px;
    overflow: hidden; /* la imagen nunca se sale del recuadro */
  }

  .card-imagen img {
    max-width: 140%;
    max-height: 140%; /* nunca puede superar el alto fijo de .card-imagen */
    width: auto;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,0.5));
    transform: scale(var(--escala, 1)); /* zoom individual, solo afecta a esta imagen */
    transform-origin: center bottom; /* crece hacia arriba, manteniendo la base fija */
  }

  .palmares-page .card-cuerpo {
    flex: 1;
    padding: 14px 16px 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .anio-pill {
    display: inline-block;
    align-self: flex-start;
    background: linear-gradient(135deg, var(--azul-claro), var(--azul));
    color: #111111;
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 0.5px;
    padding: 2px 12px;
    border-radius: 16px;
    margin-bottom: 8px;
  }

  .nombre-torneo {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--texto);
    line-height: 1.25;
    margin-bottom: 8px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .separador {
    height: 1px;
    background: var(--borde);
    margin-bottom: 8px;
  }

  .detalles {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 12px;
    margin-bottom: 10px;
  }

  .detalle .etiqueta {
     font-size: 0.45rem;
    letter-spacing: 1px;
    font-weight: 600;
    color: var(--texto-tenue);
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .detalle .valor {
  font-size: 0.7rem;
    font-weight: 500;
    color: var(--texto);
  }

  /* ---------- ECUALIZADOR DECORATIVO ---------- */
  .ecualizador {
    margin-top: auto;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 18px;
    opacity: 0.85;
  }

  .ecualizador span {
    flex: 1;
    background: linear-gradient(180deg, var(--azul-claro), var(--azul));
    border-radius: 2px;
    opacity: 0.9;
  }

  .sin-resultados {
    text-align: center;
    color: var(--texto-tenue);
    font-size: 0.9rem;
    padding: 60px 20px;
  }

  .grupo-card {
    max-width: 1610px;
    margin: 0 auto 26px;
    background: linear-gradient(180deg, #1f2a3d, #1f2a3d);
  
    border-radius: 22px;
    padding: 26px 26px 30px;
  }

  .grupo-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }

  .grupo-titulo-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .grupo-numero {
    font-size: 2.6rem;
    font-weight: 800;
    color: #eeb20c;
    line-height: 1;
  }

  .grupo-textos .grupo-eyebrow {
    font-size: 0.65rem;
    letter-spacing: 3px;
    color: #eeb20c;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .grupo-textos .grupo-titulo {
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--texto);

    display: inline-flex;

    letter-spacing: 0.5px;

<script>
  
// ── MENU ──
function toggleMenu(id, parentEl) {
  const sub = document.getElementById('sub-' + id);
  const arrow = document.getElementById('arrow-' + id);
  if (!sub) return;
  const isOpen = sub.classList.contains('open');
  document.querySelectorAll('.nav-sub').forEach(s => s.classList.remove('open'));
  document.querySelectorAll('.nav-arrow').forEach(a => a.classList.remove('open'));
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  if (!isOpen) { sub.classList.add('open'); if (arrow) arrow.classList.add('open'); parentEl.classList.add('active'); }
}
function setNavActive(el) {
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  document.querySelectorAll('.nav-sub').forEach(s => s.classList.remove('open'));
  document.querySelectorAll('.nav-arrow').forEach(a => a.classList.remove('open'));
  el.classList.add('active');
}
function setSubActive(el) {
  document.querySelectorAll('.nav-sub-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
}
function toggleSidebar() {
  document.querySelector('.sidebar').classList.toggle('open');
  document.querySelector('.sidebar-overlay').classList.toggle('show');
}
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    btn.closest('.tab-group').querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});
 
// ── SIDEBAR
fetch('sidebar.html')
  .then(res => res.text())
  .then(html => {
    document.getElementById('sidebar-container').innerHTML = html;
 
    // Marcar automáticamente el item activo según la página actual
    const pagina = window.location.pathname.split('/').pop();
    document.querySelectorAll('.nav-sub-item a').forEach(a => {
      if (a.getAttribute('href') === pagina) {
        a.closest('.nav-sub-item').classList.add('active');
 
        // Abrir el submenu padre automáticamente
        const sub = a.closest('.nav-sub');
        if (sub) {
          sub.classList.add('open');
          const id = sub.id.replace('sub-', '');
          const arrow = document.getElementById('arrow-' + id);
          if (arrow) arrow.classList.add('open');
          const parentItem = sub.previousElementSibling;
          if (parentItem) parentItem.classList.add('active');
        }
      }
    });
    document.body.style.visibility = 'visible';
  })
  .catch(err => {
    console.error('No se pudo cargar sidebar.html:', err);
    document.body.style.visibility = 'visible'; // mostrar igual aunque falle
  });

    const ICONO_RESPALDO = 'https://cdn-icons-png.flaticon.com/512/616/616489.png';
    const grid = document.getElementById('grid');

    // ==========================================================
    // AUTO-RECORTE VISUAL (no toca los archivos originales):
    // Detecta el espacio transparente (o de fondo uniforme) alrededor
    // del trofeo y recorta SOLO en pantalla, para que todas las
    // imágenes "llenen" el mismo recuadro por igual.
    // ==========================================================
    function recortarImagenEnCanvas(imgEl) {
      const w = imgEl.naturalWidth;
      const h = imgEl.naturalHeight;
      if (!w || !h) return;

      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });

      try {
        ctx.drawImage(imgEl, 0, 0);
        const { data } = ctx.getImageData(0, 0, w, h);

        let tieneAlfa = false;
        for (let i = 3; i < data.length; i += 4 * 97) {
          if (data[i] < 250) { tieneAlfa = true; break; }
        }

        let minX = w, minY = h, maxX = -1, maxY = -1;

        if (tieneAlfa) {
          const UMBRAL_ALFA = 10;
          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              const idx = (y * w + x) * 4;
              if (data[idx + 3] > UMBRAL_ALFA) {
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
              }
            }
          }
        } else {
          const br = data[0], bg = data[1], bb = data[2];
          const TOLERANCIA = 18;
          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              const idx = (y * w + x) * 4;
              const dr = Math.abs(data[idx] - br);
              const dg = Math.abs(data[idx + 1] - bg);
              const db = Math.abs(data[idx + 2] - bb);
              if (dr > TOLERANCIA || dg > TOLERANCIA || db > TOLERANCIA) {
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
              }
            }
          }
        }

        if (maxX < minX || maxY < minY) return;

        const MARGEN = 2;
        minX = Math.max(0, minX - MARGEN);
        minY = Math.max(0, minY - MARGEN);
        maxX = Math.min(w - 1, maxX + MARGEN);
        maxY = Math.min(h - 1, maxY + MARGEN);

        const cw = maxX - minX + 1;
        const ch = maxY - minY + 1;

        if (cw >= w * 0.98 && ch >= h * 0.98) return;

        const recorte = document.createElement('canvas');
        recorte.width = cw;
        recorte.height = ch;
        recorte.getContext('2d').drawImage(canvas, minX, minY, cw, ch, 0, 0, cw, ch);

        imgEl.dataset.recortada = '1';
        imgEl.src = recorte.toDataURL('image/png');
      } catch (e) {
        console.warn('No se pudo auto-recortar', imgEl.src, e);
      }
    }

    function barrasAleatorias(cantidad) {
      let html = '';
      for (let i = 0; i < cantidad; i++) {
        const alto = 30 + Math.round(Math.random() * 70);
        html += `<span style="height:${alto}%"></span>`;
      }
      return html;
    }

    // ==========================================================
    // render(categoria): dibuja en #grid solo los trofeos de la
    // categoría pedida, ordenados del más antiguo al más reciente.
    // Esta es la función que faltaba: la llaman las pestañas y la
    // línea render('masculino') de más abajo.
    // ==========================================================
    // Arma el HTML de una sola tarjeta de trofeo (la chica, con imagen)
    function tarjetaTrofeoHTML(t) {
      return `
        <div class="card">
          <div class="card-imagen">
            <img src="${t.imagen}" alt="${t.nombre}"
                 style="--escala: ${t.escala || 1};"
                 onerror="this.src='${ICONO_RESPALDO}'"
                 onload="if(!this.dataset.recortada){ recortarImagenEnCanvas(this); }">
          </div>
          <div class="card-cuerpo">
            <span class="anio-pill">${t.anio}</span>
            <div class="nombre-torneo">${t.nombre}</div>
            <div class="separador"></div>
            <div class="detalles">
              <div class="detalle">
                <div class="etiqueta">Desenlace</div>
                <div class="valor">${t.desenlace}</div>
              </div>
              <div class="detalle">
                <div class="etiqueta">Organización</div>
                <div class="valor">${t.organizacion}</div>
              </div>
            </div>
            <div class="ecualizador">${barrasAleatorias(28)}</div>
          </div>
        </div>
      `;
    }

    function render(categoria) {
      if (!grid) return;
      grid.innerHTML = '';

      const filtrados = trofeos
        .filter(t => t.categoria === categoria)
        .sort((a, b) => a.anio - b.anio);

      if (filtrados.length === 0) {
        grid.innerHTML = '<div class="sin-resultados">Todavía no hay trofeos cargados en esta categoría.</div>';
        return;
      }

      // Agrupamos por "grupo", preservando el orden de aparición
      const grupos = new Map(); // nombreGrupo -> array de trofeos
      filtrados.forEach(t => {
        const nombreGrupo = t.grupo || 'Otros torneos';
        if (!grupos.has(nombreGrupo)) grupos.set(nombreGrupo, []);
        grupos.get(nombreGrupo).push(t);
      });

      grupos.forEach((trofeosDelGrupo, nombreGrupo) => {
        const cfg = gruposConfig[nombreGrupo] || { eyebrow: 'Torneos', badge: null };

        const grupoCard = document.createElement('div');
        grupoCard.className = 'grupo-card';

        // Dentro del grupo, sub-agrupamos por "subgrupo" (si existe)
        const subgrupos = new Map();
        trofeosDelGrupo.forEach(t => {
          const nombreSub = t.subgrupo || null;
          if (!subgrupos.has(nombreSub)) subgrupos.set(nombreSub, []);
          subgrupos.get(nombreSub).push(t);
        });

        let cuerpoHTML = '';
        subgrupos.forEach((lista, nombreSub) => {
          if (nombreSub) {
            cuerpoHTML += `<div class="subgrupo-titulo">${nombreSub}</div>`;
          }
          cuerpoHTML += `<div class="grid">${lista.map(tarjetaTrofeoHTML).join('')}</div>`;
        });

        grupoCard.innerHTML = `
          <div class="grupo-header">
            <div class="grupo-titulo-wrap">
              <div class="grupo-numero">${trofeosDelGrupo.length}</div>
              <div class="grupo-textos">
                <div class="grupo-eyebrow">${cfg.eyebrow}</div>
                <div class="grupo-titulo">${nombreGrupo}</div>
              </div>
            </div>
            ${cfg.badge ? `<span class="grupo-badge">${cfg.badge}</span>` : ''}
          </div>
          ${cuerpoHTML}
        `;

        grid.appendChild(grupoCard);
      });
    }
